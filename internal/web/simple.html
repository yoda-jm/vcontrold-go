<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viessmann V200KW2 Monitor - Simple</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .parameter-card {
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }
        .parameter-card.has-value {
            border-left-color: #28a745;
        }
        .parameter-card.no-value {
            border-left-color: #dc3545;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .details-toggle:hover {
            background-color: #f8f9fa !important;
        }
        
        /* Animation styles */
        .refreshing {
            background-color: #e3f2fd !important;
            transition: background-color 0.3s ease;
            border-left: 4px solid #2196f3 !important;
        }
        
        .value-changed {
            background-color: #fff3e0 !important;
            transition: background-color 0.5s ease;
            border-left: 4px solid #ff9800 !important;
            animation: pulse-orange 1s ease-in-out;
        }
        
        .refresh-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #2196f3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }
        
        @keyframes pulse-orange {
            0%, 100% { 
                background-color: #fff3e0;
                border-left-color: #ff9800;
            }
            50% { 
                background-color: #ffcc80;
                border-left-color: #f57c00;
            }
        }
        
        .fade-back {
            transition: background-color 2s ease, border-left-color 2s ease;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="fas fa-thermometer-half"></i> Viessmann V200KW2 Monitor</h1>
                    <div>
                        <button id="refreshAllBtn" class="btn btn-primary">
                            <span class="refresh-text">Read All Parameters</span>
                            <div class="loading-spinner d-none"></div>
                        </button>
                        <button id="clearCache" class="btn btn-outline-warning ms-2">Clear Cache</button>
                        <button id="showRecentChanges" class="btn btn-outline-info ms-2">Recent Changes</button>
                        <button id="configBtn" class="btn btn-outline-secondary ms-2">Configuration</button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="row mb-4" id="summaryStats">
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body py-2">
                                <h5 class="card-title text-primary mb-0" id="totalParams">0</h5>
                                <small class="text-muted">Parameters</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body py-2">
                                <h5 class="card-title text-success mb-0" id="cachedParams">0</h5>
                                <small class="text-muted">Cached</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body py-2">
                                <h5 class="card-title text-info mb-0" id="successRate">0%</h5>
                                <small class="text-muted">Success Rate</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body py-2">
                                <h5 class="card-title text-warning mb-0" id="recentChanges">0</h5>
                                <small class="text-muted">Recent Changes</small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="addressFilter" placeholder="Filter by address (e.g., 0x810)">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="nameFilter" placeholder="Filter by name">
                    </div>
                    <div class="col-md-4">
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="showOnlyCached">
                            <label class="form-check-label" for="showOnlyCached">
                                Show only cached values
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Parameters -->
                <div id="parametersContainer"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let allDataPoints = [];
        let allCachedData = [];
        let showOnlyCached = false;
        let previousValues = {}; // Track previous values for change detection
        let eventSource = null; // Server-Sent Events connection

        $(document).ready(function() {
            loadData();
            setupEventStream();
            
            $('#refreshAllBtn').click(readAllParameters);
            $('#showOnlyCached').change(function() {
                showOnlyCached = $(this).is(':checked');
                displayParameters();
            });
            $('#addressFilter, #nameFilter').on('input', displayParameters);
            $('#clearCache').click(clearCache);
            $('#showRecentChanges').click(showRecentChanges);
            $('#configBtn').click(showConfigurationModal);
            
            // Delegated event handlers
            $(document).on('click', '.read-single-btn', function() {
                const address = $(this).data('address');
                readSingleParameter(address, $(this));
            });
            
            $(document).on('click', '.details-toggle', function() {
                const details = $(this).closest('.card-body').find('.parameter-details');
                const icon = $(this).find('i');
                
                if (details.is(':visible')) {
                    details.slideUp();
                    icon.removeClass('fa-chevron-up').addClass('fa-chevron-down');
                } else {
                    details.slideDown();
                    icon.removeClass('fa-chevron-down').addClass('fa-chevron-up');
                }
            });
            
            // Refresh data every 60 seconds for fallback (events handle real-time updates)
            setInterval(function() {
                loadData();
            }, 60000);
            
            // Also check for active refresh groups
            checkRefreshGroupStatus();
        });

        function loadData() {
            // Load both structure and cache data
            return Promise.all([
                $.get('/api/datapoints'),
                $.get('/api/cached')
            ]).then(function([dataPoints, cacheData]) {
                allDataPoints = dataPoints || [];
                
                // Detect value changes before updating allCachedData
                const newCachedData = cacheData.readings || [];
                detectValueChanges(newCachedData);
                
                allCachedData = newCachedData;
                displayParameters();
                updateStats();
            }).catch(function(error) {
                console.error('Failed to load data:', error);
                $('#parametersContainer').html('<div class="alert alert-danger">Failed to load data</div>');
            });
        }

        function detectValueChanges(newCachedData) {
            newCachedData.forEach(function(cached) {
                const address = cached.address;
                const newValue = cached.formattedValue;
                const oldValue = previousValues[address];
                
                // If we have an old value and it's different from the new value
                if (oldValue && oldValue !== newValue && cached.success) {
                    const card = $(`#card-${address}`);
                    if (card.length > 0) {
                        // Remove any existing animations
                        card.removeClass('refreshing value-changed fade-back');
                        
                        // Add value-changed animation
                        setTimeout(() => {
                            card.addClass('value-changed');
                            
                            // Remove animation after 4 seconds
                            setTimeout(() => {
                                card.removeClass('value-changed').addClass('fade-back');
                                setTimeout(() => card.removeClass('fade-back'), 2000);
                            }, 4000);
                        }, 100);
                    }
                }
                
                // Update previous value
                previousValues[address] = newValue;
            });
        }

        function showRefreshAnimation(address) {
            const card = $(`#card-${address}`);
            if (card.length > 0) {
                card.addClass('refreshing');
                
                // Auto-remove after reasonable time if no update comes
                setTimeout(() => {
                    if (card.hasClass('refreshing')) {
                        card.removeClass('refreshing').addClass('fade-back');
                        setTimeout(() => card.removeClass('fade-back'), 2000);
                    }
                }, 5000);
            }
        }

        function checkRefreshGroupStatus() {
            $.get('/api/multi-refresh/status')
                .done(function(status) {
                    if (status.running && status.groups && status.groups.length > 0) {
                        console.log(`Multi-group refresh active: ${status.active_groups} groups with ${status.total_addresses} addresses`);
                    }
                })
                .fail(function(error) {
                    console.log('Multi-group refresh status check failed:', error);
                });
        }

        function setupEventStream() {
            if (eventSource) {
                eventSource.close();
            }
            
            eventSource = new EventSource('/api/events');
            
            eventSource.onopen = function(event) {
                console.log('Event stream connected');
            };
            
            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleCacheEvent(data);
                } catch (error) {
                    console.error('Failed to parse event data:', error);
                }
            };
            
            eventSource.onerror = function(event) {
                console.error('Event stream error:', event);
                // Try to reconnect after 5 seconds
                setTimeout(() => {
                    if (eventSource.readyState === EventSource.CLOSED) {
                        setupEventStream();
                    }
                }, 5000);
            };
            
            // Close connection when page unloads
            window.addEventListener('beforeunload', function() {
                if (eventSource) {
                    eventSource.close();
                }
            });
        }

        function handleCacheEvent(event) {
            if (event.type === 'connected') {
                console.log('Event stream connected at', event.timestamp);
                return;
            }
            
            const address = event.address;
            const card = $(`#card-${address}`);
            
            if (card.length === 0) return; // Card not visible or doesn't exist
            
            // Update the value and timestamps in real-time
            const valueElement = $(`#value-${address}`);
            const refreshElement = $(`#refresh-${address}`);
            const changeElement = $(`#change-${address}`);
            
            if (event.success) {
                valueElement.text(event.value).removeClass('text-muted').addClass('text-success');
                
                // Update timestamps
                refreshElement.text(formatTimestamp(new Date(event.lastRefresh)));
                changeElement.text(formatTimestamp(new Date(event.lastChange)));
                
                // Apply animations based on event type
                card.removeClass('refreshing value-changed fade-back');
                
                if (event.type === 'refreshed') {
                    // Just refreshed, same value - show refresh animation briefly
                    card.addClass('refreshing');
                    setTimeout(() => {
                        card.removeClass('refreshing').addClass('fade-back');
                        setTimeout(() => card.removeClass('fade-back'), 2000);
                    }, 1000);
                } else if (event.type === 'changed') {
                    // Value changed - show change animation
                    card.addClass('value-changed');
                    setTimeout(() => {
                        card.removeClass('value-changed').addClass('fade-back');
                        setTimeout(() => card.removeClass('fade-back'), 2000);
                    }, 4000);
                } else if (event.type === 'created') {
                    // New value created - show change animation
                    card.addClass('value-changed');
                    setTimeout(() => {
                        card.removeClass('value-changed').addClass('fade-back');
                        setTimeout(() => card.removeClass('fade-back'), 2000);
                    }, 3000);
                }
            } else {
                // Update error state
                valueElement.text('Error: ' + (event.error || 'Unknown')).removeClass('text-success').addClass('text-muted');
                refreshElement.text(formatTimestamp(new Date(event.lastRefresh)));
            }
            
            // Update stats
            updateStats();
        }

        function displayParameters() {
            const container = $('#parametersContainer');
            container.empty();

            // Apply filters
            const addressFilter = $('#addressFilter').val().toLowerCase().replace('0x', '');
            const nameFilter = $('#nameFilter').val().toLowerCase();
            
            let filteredData = allDataPoints.filter(function(dp) {
                const cached = allCachedData.find(c => c.address === dp.address);
                
                // Show only cached filter
                if (showOnlyCached && !cached) return false;
                
                // Address filter
                if (addressFilter && !dp.address.toString(16).toLowerCase().includes(addressFilter)) return false;
                
                // Name filter
                if (nameFilter) {
                    const matchesName = dp.name.toLowerCase().includes(nameFilter);
                    const matchesAlias = dp.aliasNames && dp.aliasNames.some(alias => 
                        alias.toLowerCase().includes(nameFilter)
                    );
                    if (!matchesName && !matchesAlias) return false;
                }
                
                return true;
            });

            if (filteredData.length === 0) {
                container.html('<div class="alert alert-info">No parameters match current filters</div>');
                return;
            }

            const row = $('<div class="row">');
            
            filteredData.forEach(function(dp) {
                const cached = allCachedData.find(c => c.address === dp.address);
                const col = $('<div class="col-md-6 col-lg-4 mb-3">');
                col.append(createParameterCard(dp, cached));
                row.append(col);
            });
            
            container.append(row);
        }

        function createParameterCard(dp, cached) {
            const hasValue = cached && cached.success;
            const value = hasValue ? cached.formattedValue : 'No reading';
            const valueClass = hasValue ? 'text-success' : 'text-muted';
            const cardClass = hasValue ? 'has-value' : 'no-value';
            
            const lastRefresh = cached ? formatTimestamp(new Date(cached.lastRefresh)) : 'Never';
            const lastChange = cached ? formatTimestamp(new Date(cached.lastChange)) : 'Never';
            
            const aliases = dp.aliasNames ? dp.aliasNames.filter(alias => 
                alias && alias.trim() && !alias.startsWith('XML-only')
            ).join(', ') : '';

            return $(`
                <div class="card parameter-card ${cardClass}" data-address="${dp.address}" id="card-${dp.address}">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div class="flex-grow-1">
                                <h6 class="mb-1">${dp.name}</h6>
                                <small class="text-muted">0x${dp.address.toString(16).toUpperCase()}</small>
                            </div>
                            <button class="btn btn-sm btn-outline-primary read-single-btn" data-address="${dp.address}">
                                <span class="read-text">Read</span>
                                <div class="refresh-spinner d-none"></div>
                            </button>
                        </div>
                        
                        <div class="mb-2">
                            <strong class="${valueClass}" id="value-${dp.address}">${value}</strong>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="text-muted">Refreshed: <span id="refresh-${dp.address}">${lastRefresh}</span></small><br>
                                <small class="text-muted">Changed: <span id="change-${dp.address}">${lastChange}</span></small>
                            </div>
                            <button class="btn btn-sm btn-link details-toggle p-1">
                                <i class="fas fa-chevron-down"></i>
                            </button>
                        </div>
                        
                        <div class="parameter-details mt-2" style="display: none;">
                            <hr class="my-2">
                            <small class="text-muted"><strong>Type:</strong> ${dp.dataType}</small><br>
                            ${dp.unitType ? `<small class="text-muted"><strong>Unit:</strong> ${dp.unitType}</small><br>` : ''}
                            ${cached && cached.unitSource ? `<small class="text-muted"><strong>Unit Source:</strong> ${cached.unitSource}</small><br>` : ''}
                            ${aliases ? `<small class="text-info"><strong>Aliases:</strong> ${aliases}</small><br>` : ''}
                            ${cached && cached.previousValue ? `<small class="text-warning"><strong>Previous:</strong> ${cached.previousValue}</small><br>` : ''}
                            ${cached && cached.changeCount > 1 ? `<small class="text-info"><strong>Changes:</strong> ${cached.changeCount}</small>` : ''}
                        </div>
                    </div>
                </div>
            `);
        }

        function formatTimestamp(date) {
            if (!date || isNaN(date.getTime())) return 'Never';
            
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function readAllParameters() {
            const btn = $('#refreshAllBtn');
            const text = $('.refresh-text');
            const spinner = $('.loading-spinner');
            
            btn.prop('disabled', true);
            text.addClass('d-none');
            spinner.removeClass('d-none');
            
            $.get('/api/readings')
                .done(function() {
                    setTimeout(loadData, 1000); // Reload after cache updates
                })
                .fail(function(xhr) {
                    alert('Failed to read parameters: ' + (xhr.responseText || 'Unknown error'));
                })
                .always(function() {
                    btn.prop('disabled', false);
                    text.removeClass('d-none');
                    spinner.addClass('d-none');
                });
        }

        function readSingleParameter(address, button) {
            const text = button.find('.read-text');
            const spinner = button.find('.refresh-spinner');
            const card = $(`#card-${address}`);
            
            // Store old value for comparison
            const oldValue = $(`#value-${address}`).text();
            
            button.prop('disabled', true);
            text.addClass('d-none');
            spinner.removeClass('d-none');
            
            // Add refreshing animation to card
            card.addClass('refreshing');
            
            // Find the datapoint index
            const dpIndex = allDataPoints.findIndex(dp => dp.address === address);
            if (dpIndex === -1) return;
            
            $.get(`/api/reading/${dpIndex}`)
                .done(function() {
                    // Reload data and check for value changes
                    setTimeout(() => {
                        loadData().then(() => {
                            const newValue = $(`#value-${address}`).text();
                            
                            // Check if value changed
                            if (oldValue !== newValue && newValue !== 'No reading') {
                                card.removeClass('refreshing').addClass('value-changed');
                                
                                // Remove change animation after 3 seconds
                                setTimeout(() => {
                                    card.removeClass('value-changed').addClass('fade-back');
                                    setTimeout(() => card.removeClass('fade-back'), 2000);
                                }, 3000);
                            } else {
                                // Just remove refreshing animation
                                setTimeout(() => {
                                    card.removeClass('refreshing').addClass('fade-back');
                                    setTimeout(() => card.removeClass('fade-back'), 2000);
                                }, 1000);
                            }
                        });
                    }, 500);
                })
                .fail(function(xhr) {
                    alert('Failed to read parameter: ' + (xhr.responseText || 'Unknown error'));
                    card.removeClass('refreshing');
                })
                .always(function() {
                    button.prop('disabled', false);
                    text.removeClass('d-none');
                    spinner.addClass('d-none');
                });
        }

        function updateStats() {
            const total = allDataPoints.length;
            const cached = allCachedData.filter(c => c.success).length;
            const recent = allCachedData.filter(c => {
                const changeDate = new Date(c.lastChange);
                return (new Date() - changeDate) < 3600000; // 1 hour
            }).length;
            
            $('#totalParams').text(total);
            $('#cachedParams').text(cached);
            $('#successRate').text(total > 0 ? Math.round(cached/total * 100) + '%' : '0%');
            $('#recentChanges').text(recent);
        }

        function clearCache() {
            if (!confirm('Clear all cached readings?')) return;
            
            $.post('/api/cache/clear')
                .done(function() {
                    loadData();
                    alert('Cache cleared');
                })
                .fail(function(xhr) {
                    alert('Failed to clear cache: ' + (xhr.responseText || 'Unknown error'));
                });
        }

        function showRecentChanges() {
            const since = prompt('Show changes since (e.g., 1h, 30m):', '1h');
            if (!since) return;
            
            $.get(`/api/recent-changes?since=${encodeURIComponent(since)}`)
                .done(function(data) {
                    showChangesModal(data);
                })
                .fail(function(xhr) {
                    alert('Failed to load changes: ' + (xhr.responseText || 'Unknown error'));
                });
        }

        function showChangesModal(data) {
            const modal = $(`
                <div class="modal fade" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Recent Changes (${data.since})</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <p><strong>${data.count}</strong> parameters changed in the last ${data.since}</p>
                                <div id="changesList"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `);
            
            $('body').append(modal);
            
            if (data.changes && data.changes.length > 0) {
                const list = modal.find('#changesList');
                data.changes.forEach(function(change) {
                    const item = $(`
                        <div class="card mb-2">
                            <div class="card-body">
                                <h6>${change.name} (${change.hexAddress})</h6>
                                <p class="mb-1">
                                    <strong>Current:</strong> ${change.currentValue}<br>
                                    ${change.previousValue ? `<strong>Previous:</strong> ${change.previousValue}<br>` : ''}
                                    <strong>Changed:</strong> ${new Date(change.lastChange).toLocaleString()}<br>
                                    <strong>Total Changes:</strong> ${change.changeCount}
                                </p>
                            </div>
                        </div>
                    `);
                    list.append(item);
                });
            } else {
                modal.find('#changesList').html('<p class="text-muted">No changes found</p>');
            }
            
            const modalInstance = new bootstrap.Modal(modal[0]);
            modalInstance.show();
            
            modal.on('hidden.bs.modal', function() {
                modal.remove();
            });
        }

        function showConfigurationModal() {
            const modal = $(`
                <div class="modal fade" tabindex="-1">
                    <div class="modal-dialog modal-xl">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Configuration</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <!-- Tab Navigation -->
                                <ul class="nav nav-tabs" id="configTabs" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link active" id="general-tab" data-bs-toggle="tab" data-bs-target="#general" type="button" role="tab">
                                            <i class="fas fa-cogs"></i> General
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link" id="groups-tab" data-bs-toggle="tab" data-bs-target="#groups" type="button" role="tab">
                                            <i class="fas fa-layer-group"></i> Refresh Groups
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link" id="mqtt-tab" data-bs-toggle="tab" data-bs-target="#mqtt" type="button" role="tab">
                                            <i class="fas fa-share-alt-square"></i> MQTT
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link" id="mqtt-hooks-tab" data-bs-toggle="tab" data-bs-target="#mqtt-hooks" type="button" role="tab">
                                            <i class="fas fa-plug"></i> MQTT Hooks
                                        </button>
                                    </li>
                                </ul>
                                
                                <!-- Tab Content -->
                                <div class="tab-content" id="configTabContent">
                                    <!-- General Tab -->
                                    <div class="tab-pane fade show active" id="general" role="tabpanel">
                                        <div class="card mt-3">
                                            <div class="card-header">
                                                <h6 class="mb-0">Current YAML Configuration</h6>
                                                <small class="text-muted">Read-only - edit config.yaml file directly</small>
                                            </div>
                                            <div class="card-body">
                                                <div class="row mb-3">
                                                    <div class="col-md-6">
                                                        <label for="configDevice" class="form-label">Device:</label>
                                                        <input type="text" class="form-control" id="configDevice" readonly>

        function loadConfigurationData(modal) {
            // Load refresh groups
            $.get('/api/multi-refresh/groups')
                .done(function(refreshGroups) {
                    const container = modal.find('#refreshGroups');
                    container.empty();
                    
                    if (refreshGroups && refreshGroups.length > 0) {
                        refreshGroups.forEach(function(group) {
                            addRefreshGroupRow(group);
                        });
                    } else {
                        addRefreshGroupRow(); // Add empty row
                    }
                })
                .fail(function() {
                    console.error('Failed to load refresh groups config');
                });
            
            // Load YAML config (read-only display)
            $.get('/api/config/yaml')
                .done(function(yamlConfig) {
                    // General tab
                    modal.find('#configDevice').val(yamlConfig.device || '');
                    modal.find('#configWebPort').val(yamlConfig.web_port || '');
                    modal.find('#configVControlXML').val(yamlConfig.vcontrol_xml || '');
                    modal.find('#configVitoXML').val(yamlConfig.vito_xml || '');
                    modal.find('#configFile').val(yamlConfig.config_file || '');
                    modal.find('#configVerbose').prop('checked', yamlConfig.verbose || false);
                    modal.find('#configWebMode').prop('checked', yamlConfig.web || false);
                    
                    // MQTT tab
                    const mqttConfig = yamlConfig.mqtt || {};
                    modal.find('#mqttEnabled').prop('checked', mqttConfig.enabled || false);
                    modal.find('#mqttHost').val(mqttConfig.host || 'localhost:1883');
                    modal.find('#mqttTopicRoot').val(mqttConfig.topic_root || 'viessmann');
                    modal.find('#mqttUsername').val(mqttConfig.username || '');
                    modal.find('#mqttPassword').val(mqttConfig.password || '');
                    modal.find('#mqttRefreshThreshold').val(mqttConfig.refresh_threshold || '1h');
                    
                    // Load MQTT addresses
                    loadMqttAddresses(mqttConfig.addresses || []);
                    
                    // Toggle MQTT settings visibility
                    toggleMqttSettings();
                })
                .fail(function() {
                    console.error('Failed to load YAML config');
                });
        }

        function saveRefreshGroups(modal) {
            const saveBtn = modal.find('#saveRefreshGroupsBtn');
            saveBtn.prop('disabled', true).text('Saving...');
            
            // Collect refresh groups config
            const refreshGroups = [];
            
            modal.find('.refresh-group').each(function() {
                const groupCard = $(this);
                const name = groupCard.find('.group-name').val().trim();
                const interval = groupCard.find('.group-interval').val();
                const enabled = groupCard.find('.group-enabled').is(':checked');
                const addresses = [];
                
                groupCard.find('.group-address-input').each(function() {
                    const address = $(this).val().trim();
                    if (address) {
                        addresses.push(address);
                    }
                });
                
                if (name && addresses.length > 0) {
                    refreshGroups.push({
                        name: name,
                        interval: interval,
                        enabled: enabled,
                        addresses: addresses
                    });
                }
            });
            
            // Save refresh groups
            $.ajax({
                url: '/api/multi-refresh/groups',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(refreshGroups)
            })
            .done(function(response) {
                alert('Refresh groups saved successfully!');
                modal.modal('hide');
                loadData(); // Refresh the main view
            })
            .fail(function(xhr) {
                alert('Failed to save refresh groups: ' + (xhr.responseText || 'Unknown error'));
            })
            .always(function() {
                saveBtn.prop('disabled', false).text('Save Refresh Groups');
            });
        }

        function loadMqttAddresses(addresses) {
            const container = $('#mqttAddresses');
            container.empty();
            
            if (addresses && addresses.length > 0) {
                addresses.forEach(function(addr) {
                    addMqttAddressRow(addr.address, addr.alias);
                });
            } else {
                addMqttAddressRow('', ''); // Add empty row
            }
        }

        function toggleMqttSettings() {
            const enabled = $('#mqttEnabled').is(':checked');
            $('#mqttSettings').toggle(enabled);
        }

        function saveMqttConfig(modal) {
            const saveBtn = modal.find('#saveMqttConfigBtn');
            saveBtn.prop('disabled', true).text('Saving...');
            
            // Collect MQTT addresses
            const mqttAddresses = [];
            modal.find('.mqtt-address-row').each(function() {
                const address = $(this).find('.mqtt-address-input').val().trim();
                const alias = $(this).find('.mqtt-alias-input').val().trim();
                
                if (address && alias) {
                    mqttAddresses.push({
                        address: address,
                        alias: alias
                    });
                }
            });
            
            // Create MQTT config object
            const mqttConfig = {
                enabled: modal.find('#mqttEnabled').is(':checked'),
                host: modal.find('#mqttHost').val().trim(),
                username: modal.find('#mqttUsername').val().trim(),
                password: modal.find('#mqttPassword').val().trim(),
                topic_root: modal.find('#mqttTopicRoot').val().trim(),
                refresh_threshold: modal.find('#mqttRefreshThreshold').val().trim() || '1h',
                addresses: mqttAddresses
            };
            
            // Get current full YAML config and update MQTT section
            $.get('/api/config/yaml')
                .done(function(currentConfig) {
                    currentConfig.mqtt = mqttConfig;
                    
                    // Save updated config
                    $.ajax({
                        url: '/api/config/yaml',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(currentConfig)
                    })
                    .done(function(response) {
                        alert('MQTT configuration saved successfully!');
                        modal.modal('hide');
                        loadData(); // Refresh the main view
                    })
                    .fail(function(xhr) {
                        alert('Failed to save MQTT configuration: ' + (xhr.responseText || 'Unknown error'));
                    })
                    .always(function() {
                        saveBtn.prop('disabled', false).text('Save MQTT Config');
                    });
                })
                .fail(function() {
                    alert('Failed to load current configuration');
                    saveBtn.prop('disabled', false).text('Save MQTT Config');
                });
        }
        
        // MQTT Hooks Functions
        function loadMqttHooks() {
            const container = $('#mqttHooksList');
            const statusInfo = $('#hookStatusInfo');
            const statusBadge = $('#hookStatusBadge');
            
            statusBadge.text('Loading...');
            
            // Load hooks and status in parallel
            Promise.all([
                $.get('/api/mqtt/hooks'),
                $.get('/api/mqtt/hooks/status')
            ])
            .then(function([hooks, status]) {
                displayMqttHooks(hooks);
                displayHookStatus(status);
                
                if (status.connected) {
                    statusBadge.removeClass('bg-secondary bg-danger').addClass('bg-success').text('Connected');
                } else {
                    statusBadge.removeClass('bg-secondary bg-success').addClass('bg-danger').text('Disconnected');
                }
            })
            .catch(function(error) {
                console.error('Failed to load MQTT hooks:', error);
                container.html('<div class="alert alert-danger">Failed to load MQTT hooks</div>');
                statusBadge.removeClass('bg-secondary bg-success').addClass('bg-danger').text('Error');
            });
        }
        
        function displayMqttHooks(hooks) {
            const container = $('#mqttHooksList');
            const noHooksMessage = $('#noHooksMessage');
            
            container.empty();
            
            if (!hooks || hooks.length === 0) {
                noHooksMessage.show();
                return;
            }
            
            noHooksMessage.hide();
            
            hooks.forEach(function(hook, index) {
                const enabledBadge = hook.enabled 
                    ? '<span class="badge bg-success">Enabled</span>' 
                    : '<span class="badge bg-secondary">Disabled</span>';
                    
                const toggleButton = hook.enabled 
                    ? '<button class="btn btn-sm btn-outline-warning toggle-hook-btn" data-hook-index="' + index + '">Disable</button>'
                    : '<button class="btn btn-sm btn-outline-success toggle-hook-btn" data-hook-index="' + index + '">Enable</button>';
                
                const actionDetails = getActionDetails(hook.action);
                
                const hookCard = $(`
                    <div class="card mb-3 hook-card-${index}">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-8">
                                    <h6 class="mb-1">${hook.description}</h6>
                                    <p class="mb-1">
                                        <small class="text-muted">
                                            <strong>Topic:</strong> <code>${hook.topic}</code><br>
                                            <strong>Action:</strong> ${hook.action.type} ${actionDetails}
                                        </small>
                                    </p>
                                </div>
                                <div class="col-md-4 text-end">
                                    ${enabledBadge}
                                    <div class="mt-2">
                                        ${toggleButton}
                                        <button class="btn btn-sm btn-outline-info test-hook-btn ms-1" data-hook-index="${index}">Test</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `);
                
                container.append(hookCard);
            });
        }
        
        function getActionDetails(action) {
            let details = '';
            if (action.zone) details += `(${action.zone})`;
            if (action.address) details += ` → ${action.address}`;
            if (action.parameter) details += ` → ${action.parameter}`;
            if (action.min_value && action.max_value) {
                details += ` [${action.min_value}-${action.max_value}]`;
            }
            return details;
        }
        
        function displayHookStatus(status) {
            const statusInfo = $('#hookStatusInfo');
            
            const statusHtml = `
                <div class="row">
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="h6 mb-0">${status.total_hooks || 0}</div>
                            <small class="text-muted">Total Hooks</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="h6 mb-0 text-success">${status.enabled_hooks || 0}</div>
                            <small class="text-muted">Enabled</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="h6 mb-0 ${status.connected ? 'text-success' : 'text-danger'}">${status.connected ? 'Yes' : 'No'}</div>
                            <small class="text-muted">Connected</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="h6 mb-0">${status.total_hooks - status.enabled_hooks || 0}</div>
                            <small class="text-muted">Disabled</small>
                        </div>
                    </div>
                </div>
            `;
            
            statusInfo.html(statusHtml);
        }
        
        function toggleMqttHook(hookIndex, button) {
            button.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i>');
            
            $.post(`/api/mqtt/hooks/${hookIndex}/toggle`)
                .done(function(response) {
                    if (response.success) {
                        // Reload hooks to reflect changes
                        loadMqttHooks();
                        
                        // Show success message briefly
                        const originalText = button.text();
                        button.removeClass('btn-outline-warning btn-outline-success')
                             .addClass('btn-success')
                             .text('✓ ' + response.message);
                        
                        setTimeout(function() {
                            loadMqttHooks(); // Refresh the entire display
                        }, 1500);
                    }
                })
                .fail(function(xhr) {
                    alert('Failed to toggle hook: ' + (xhr.responseJSON?.error || xhr.responseText || 'Unknown error'));
                    button.prop('disabled', false).text(button.data('original-text') || 'Toggle');
                });
        }
        
        function testMqttHook(hookIndex) {
            const testPayload = prompt('Enter test payload:', '45.0');
            if (!testPayload) return;
            
            $.ajax({
                url: `/api/mqtt/hooks/test/${hookIndex}`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ payload: testPayload })
            })
            .done(function(response) {
                if (response.success) {
                    alert('Test sent successfully!\n\n' + response.message);
                }
            })
            .fail(function(xhr) {
                alert('Failed to test hook: ' + (xhr.responseJSON?.error || xhr.responseText || 'Unknown error'));
            });
        }
    </script>
</body>
</html>
