# Vue « Chaudière » du tableau de bord Tablette — Home Assistant
#
# Ce fichier est le reflet de ce qui est DÉPLOYÉ, exporté depuis Home Assistant.
# Il sert de sauvegarde et de référence ; la vue elle-même a été posée par
# l'API WebSocket (`lovelace/config/save`), pas par un copier-coller.
#
# Rien à déclarer côté configuration.yaml : les 23 entités — dont les deux
# thermostats et la durée moyenne d'un cycle — viennent toutes de la découverte
# MQTT du daemon. Leurs identifiants sont fixés par `object_id`, donc stables.
#
# Pour ré-appliquer cette vue après modification :
#   Tableau de bord Tablette → ⋮ → Modifier → ⋮ → Modifier en YAML
#   puis remplacer l'entrée dont `path: chaudiere`.

views:
- type: sections
  max_columns: 4
  title: Chaudière
  path: chaudiere
  icon: mdi:water-boiler
  badges:
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: binary_sensor.vitola_200_bruleur
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.vitola_200_temperature_exterieure
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.vitola_200_mode_de_fonctionnement
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: binary_sensor.vitola_200_defaut
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Pilotage
      heading_style: title
      icon: mdi:thermostat
    - type: thermostat
      entity: climate.vitola_200_eau_chaude_sanitaire
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - 'off'
        - heat
    - type: thermostat
      entity: climate.vitola_200_chauffage
  - type: grid
    cards:
    - type: heading
      heading: Températures
      heading_style: title
      icon: mdi:thermometer
    - type: tile
      entity: sensor.vitola_200_temperature_chaudiere
      name: Chaudière
    - type: tile
      entity: sensor.vitola_200_temperature_eau_chaude
      name: Eau chaude
    - type: tile
      entity: sensor.vitola_200_temperature_de_depart
      name: Départ
    - type: tile
      entity: sensor.vitola_200_temperature_exterieure
      name: Extérieure
    - type: tile
      entity: sensor.vitola_200_consigne_chaudiere
      name: Consigne chaudière
    - type: history-graph
      title: 24 heures
      hours_to_show: 24
      entities:
      - entity: sensor.vitola_200_temperature_chaudiere
        name: Chaudière
      - entity: sensor.vitola_200_temperature_eau_chaude
        name: Eau chaude
      - entity: sensor.vitola_200_temperature_de_depart
        name: Départ
      - entity: sensor.vitola_200_temperature_exterieure
        name: Extérieure
  - type: grid
    cards:
    - type: heading
      heading: Organes
      heading_style: title
      icon: mdi:pump
    - type: tile
      entity: binary_sensor.vitola_200_bruleur
      name: Brûleur
      color: red
    - type: tile
      entity: binary_sensor.vitola_200_circulateur_m1
      name: Circulateur
      color: blue
    - type: tile
      entity: binary_sensor.vitola_200_pompe_de_charge_ballon
      name: Charge ballon
      color: blue
    - type: tile
      entity: binary_sensor.vitola_200_pompe_de_bouclage
      name: Bouclage
      color: blue
    - type: history-graph
      title: Cyclage (24 h)
      hours_to_show: 24
      entities:
      - entity: binary_sensor.vitola_200_bruleur
        name: Brûleur
      - entity: binary_sensor.vitola_200_circulateur_m1
        name: Circulateur
      - entity: binary_sensor.vitola_200_pompe_de_charge_ballon
        name: Charge ballon
  - type: grid
    cards:
    - type: heading
      heading: Compteurs
      heading_style: title
      icon: mdi:counter
    - type: tile
      entity: sensor.vitola_200_heures_bruleur
      name: Heures brûleur
      color: amber
    - type: tile
      entity: sensor.vitola_200_demarrages_bruleur
      name: Démarrages
      color: amber
    - type: tile
      entity: sensor.vitola_200_duree_moyenne_d_un_cycle
      name: Durée moyenne d'un cycle
      color: deep-orange
    - type: statistics-graph
      title: Cumuls (30 jours)
      days_to_show: 30
      period: day
      stat_types:
      - state
      entities:
      - sensor.vitola_200_heures_bruleur
      - sensor.vitola_200_demarrages_bruleur
  - type: grid
    cards:
    - type: heading
      heading: Réglages
      heading_style: title
      icon: mdi:tune
    - type: tile
      entity: sensor.vitola_200_mode_de_fonctionnement
      name: Mode
    - type: tile
      entity: sensor.vitola_200_consigne_ambiance_normale
      name: Ambiance normale
    - type: tile
      entity: sensor.vitola_200_consigne_ambiance_reduite
      name: Ambiance réduite
    - type: tile
      entity: sensor.vitola_200_pente_de_la_courbe_de_chauffe
      name: Pente de chauffe
    - type: tile
      entity: sensor.vitola_200_niveau_de_la_courbe_de_chauffe
      name: Niveau de chauffe
    - type: tile
      entity: binary_sensor.vitola_200_mode_economie
      name: Économie
    - type: tile
      entity: binary_sensor.vitola_200_mode_reception
      name: Réception
    - type: tile
      entity: binary_sensor.vitola_200_defaut
      name: Défaut
      color: red
