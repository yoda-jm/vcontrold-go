# Boiler view for the Home Assistant dashboard
#
# Exported from what is deployed. Installed through the WebSocket API, so this
# file is a reviewable copy rather than a second source that would drift.
#
# One view, no prose. Current state at the top -- gauge, tiles, two history
# graphs -- and monthly bars at the bottom. The monthly charts read the
# statistics table, kept indefinitely, rather than the states table purged
# after purge_keep_days; each card carries its own days_to_show, so mixing
# ranges on one page needs no separate tab.
#
# Entities come from the daemon's MQTT discovery, except
# openv:degree_days_monthly, an external statistic imported by
# scripts/ha_statistics.py from measured monthly weather.

views:
- type: sections
  max_columns: 4
  title: Chaudière
  path: chaudiere
  icon: mdi:water-boiler
  badges:
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: binary_sensor.vitola_200_bruleur
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.vitola_200_temperature_chaudiere
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.vitola_200_temperature_exterieure
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.vitola_200_mode_de_fonctionnement
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: binary_sensor.vitola_200_defaut
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Pilotage
      heading_style: title
      icon: mdi:thermostat
    - type: thermostat
      entity: climate.vitola_200_eau_chaude_sanitaire
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - 'off'
        - heat
    - type: thermostat
      entity: climate.vitola_200_chauffage
  - type: grid
    cards:
    - type: heading
      heading: Températures
      heading_style: title
      icon: mdi:thermometer
    - type: gauge
      entity: sensor.vitola_200_temperature_chaudiere
      name: Chaudière
      unit: °C
      min: 0
      max: 90
      needle: true
      severity:
        green: 0
        yellow: 65
        red: 80
    - type: tile
      entity: sensor.vitola_200_temperature_eau_chaude
      name: Eau chaude
    - type: tile
      entity: sensor.vitola_200_temperature_de_depart
      name: Départ
    - type: tile
      entity: sensor.vitola_200_temperature_de_retour
      name: Retour
    - type: tile
      entity: sensor.vitola_200_temperature_exterieure
      name: Extérieure
      color: cyan
    - type: history-graph
      title: 24 heures
      hours_to_show: 24
      entities:
      - entity: sensor.vitola_200_temperature_chaudiere
        name: Chaudière
      - entity: sensor.vitola_200_temperature_eau_chaude
        name: Eau chaude
      - entity: sensor.vitola_200_temperature_de_depart
        name: Départ
      - entity: sensor.vitola_200_temperature_de_retour
        name: Retour
      - entity: sensor.vitola_200_temperature_exterieure
        name: Extérieure
  - type: grid
    cards:
    - type: heading
      heading: Organes
      heading_style: title
      icon: mdi:pump
    - type: tile
      entity: binary_sensor.vitola_200_bruleur
      name: Brûleur
      color: red
    - type: tile
      entity: binary_sensor.vitola_200_circulateur_m1
      name: Circulateur M1
      color: blue
    - type: tile
      entity: binary_sensor.vitola_200_pompe_de_charge_ballon
      name: Charge ballon
      color: blue
    - type: tile
      entity: binary_sensor.vitola_200_pompe_de_bouclage
      name: Bouclage ECS
      color: blue
    - type: tile
      entity: binary_sensor.vitola_200_defaut
      name: Défaut
      color: red
    - type: history-graph
      title: Marche sur 24 h
      hours_to_show: 24
      entities:
      - entity: binary_sensor.vitola_200_bruleur
        name: Brûleur
      - entity: binary_sensor.vitola_200_circulateur_m1
        name: Circulateur
      - entity: binary_sensor.vitola_200_pompe_de_charge_ballon
        name: Charge ballon
      - entity: binary_sensor.vitola_200_pompe_de_bouclage
        name: Bouclage
  - type: grid
    cards:
    - type: heading
      heading: Compteurs
      heading_style: title
      icon: mdi:counter
    - type: tile
      entity: sensor.vitola_200_heures_bruleur
      name: Heures brûleur
      color: amber
    - type: tile
      entity: sensor.vitola_200_demarrages_bruleur
      name: Démarrages
      color: amber
    - type: tile
      entity: sensor.vitola_200_duree_moyenne_d_un_cycle
      name: Cycle moyen
      color: deep-orange
    - type: tile
      entity: sensor.vitola_200_heures_pompe_de_bouclage
      name: Heures bouclage
      color: blue
    - type: statistics-graph
      title: Heures par jour (30 jours)
      days_to_show: 30
      period: day
      chart_type: bar
      stat_types:
      - change
      entities:
      - entity: sensor.vitola_200_heures_bruleur
        name: Brûleur
      - entity: sensor.vitola_200_heures_pompe_de_bouclage
        name: Bouclage
      - entity: sensor.vitola_200_heures_circulateur_m1
        name: Circulateur
  - type: grid
    cards:
    - type: heading
      heading: Réglages
      heading_style: title
      icon: mdi:tune
    - type: tile
      entity: sensor.vitola_200_mode_de_fonctionnement
      name: Mode
    - type: tile
      entity: sensor.vitola_200_consigne_chaudiere
      name: Consigne chaudière
    - type: tile
      entity: sensor.vitola_200_pente_de_la_courbe_de_chauffe
      name: Pente
    - type: tile
      entity: sensor.vitola_200_niveau_de_la_courbe_de_chauffe
      name: Niveau
    - type: tile
      entity: sensor.vitola_200_consigne_ambiance_normale
      name: Ambiance normale
    - type: tile
      entity: sensor.vitola_200_consigne_ambiance_reduite
      name: Ambiance réduite
  - type: grid
    cards:
    - type: heading
      heading: Historique
      heading_style: title
      icon: mdi:chart-timeline-variant
    - type: statistics-graph
      title: Heures brûleur par mois
      days_to_show: 400
      period: month
      chart_type: bar
      stat_types:
      - change
      entities:
      - entity: sensor.vitola_200_heures_bruleur
        name: Heures brûleur
    - type: statistics-graph
      title: Heures de bouclage par mois
      days_to_show: 400
      period: month
      chart_type: bar
      stat_types:
      - change
      entities:
      - entity: sensor.vitola_200_heures_pompe_de_bouclage
        name: Bouclage
    - type: statistics-graph
      title: Degrés-jours par mois
      days_to_show: 400
      period: month
      chart_type: bar
      stat_types:
      - change
      entities:
      - entity: openv:degree_days_monthly
        name: DJU base 18
