# Copy to config-openv.yaml and adapt. The real file is gitignored.
# The third_party/ paths are created by: make deps
#
# All addresses and lengths come from vito.xml; only 0x088A is corrected, via
# overrides/vitola200-kw2.xml. Nothing is hard-coded here.
#
# On naming: the get*/set* identifiers and the German terms in them (soll =
# setpoint, ist = actual, WW = Warmwasser/hot water, Betriebsart = operating
# mode) are NOT ours to rename. They are the command names of the community
# vito.xml, and keeping them is what lets any address here be traced back to
# the upstream XML and to the openv documentation. Only the friendly_name
# fields are translated, because those are what Home Assistant displays.

device: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_XXXX-if00-port0

vcontrol_xml:       third_party/vcontrold/xml/kw/vcontrold.xml
vito_xml:           third_party/vcontrold/xml/kw/vito.xml
vito_overrides_xml: overrides/vitola200-kw2.xml

# web: true is MANDATORY. MQTT publishing is carried by the web server; in CLI
# mode the daemon reads once and exits without ever publishing.
web: true
web_port: "8080"
verbose: false

refresh_groups:
  # The heating runs through circuit M2, the mixed circuit: every 0x3xxx
  # address below. A1/M1 (0x2xxx) is not connected on this installation. Its
  # pump totalled 0.18 h over the boiler's life, and on 2026-10-18, when the
  # heating was started at the panel, 0x2301 stayed on WW while 0x3301 read
  # H+WW. Until that date this file polled M1, the idle circuit.
  #
  # What moves: states and temperatures.
  - name: Temperatures and states
    interval: 60s
    enabled: true
    addresses:
      - "0x0800"   # outside temperature
      - "0x0802"   # boiler temperature
      - "0x0804"   # hot water temperature
      - "0x080C"   # flow temperature (the only flow probe present)
      - "0x5502"   # boiler setpoint
      - "0x551E"   # burner state
      - "0x3906"   # circulator M2 state
      - "0x0845"   # cylinder charge pump
      - "0x0846"   # circulation pump
      - "0x3301"   # operating mode M2
      - "0x7579"   # collective fault

  # What barely moves: counters and setpoints. Polling them often gains
  # nothing and ties up the optical link.
  - name: Counters and setpoints
    interval: 5m
    enabled: true
    addresses:
      - "0x08A7"   # burner hours
      - "0x088A"   # burner starts
      - "0x08AB"   # burner hours, stage 2
      - "0x6300"   # hot water setpoint
      - "0x3306"   # normal room setpoint M2
      - "0x3307"   # reduced room setpoint M2
      - "0x3304"   # heating curve level M2
      - "0x3305"   # heating curve slope M2
      - "0x3302"   # eco mode M2
      - "0x3303"   # party mode M2
      - "0x3308"   # party setpoint M2

  # Schedules and fault history. Both change on the scale of months, so they
  # are read four times a day rather than every minute -- 31 addresses at about
  # two seconds each is a minute of link time per cycle.
  #
  # The three schedules are read Monday first, in the order the appliance stores
  # them; mqtt_schedules below gathers each set of seven into one entity.
  - name: Schedules and faults
    interval: 6h
    enabled: true
    addresses:
      - "0x3000"   # heating circuit M2 schedule, Monday
      - "0x3008"   # Tuesday
      - "0x3010"   # Wednesday
      - "0x3018"   # Thursday
      - "0x3020"   # Friday
      - "0x3028"   # Saturday
      - "0x3030"   # Sunday
      - "0x2100"   # hot-water schedule, Monday
      - "0x2108"   # Tuesday
      - "0x2110"   # Wednesday
      - "0x2118"   # Thursday
      - "0x2120"   # Friday
      - "0x2128"   # Saturday
      - "0x2130"   # Sunday
      - "0x2200"   # recirculation schedule, Monday
      - "0x2208"   # Tuesday
      - "0x2210"   # Wednesday
      - "0x2218"   # Thursday
      - "0x2220"   # Friday
      - "0x2228"   # Saturday
      - "0x2230"   # Sunday
      - "0x7507"   # fault history, most recent
      - "0x7510"
      - "0x7519"
      - "0x7522"
      - "0x752B"
      - "0x7534"
      - "0x753D"
      - "0x7546"
      - "0x754F"
      - "0x7558"

mqtt:
  enabled: true
  host: broker.local:1883
  username: vcontrold
  password: changeme          # ne pas versionner ce fichier
  topic_root: openv
  refresh_threshold: 1h

  # The alias gives the topic name: openv/<alias>.
  # device_class / state_class are derived from the vito.xml unit; they appear
  # here only where the XML is not enough.
  addresses:
    # --- The two counters the energy case rests on --------------------------
    - address: "0x08A7"
      alias: getBrennerStunden1
      friendly_name: Heures brûleur
      # Burner hours cannot rise faster than one hour per hour of wall time.
      # A corrupt frame that passes this bound is indistinguishable from truth;
      # one that does not is refused before it can become permanent history.
      max_increase_per_hour: 1.05
    # Stage 2 of the burner. The appliance is sold as 22/24 kW, which suggests
    # two firing rates, and hours spent on stage 2 are not counted by stage 1.
    # Any efficiency figure has to be computed on the sum of both.
    - address: "0x08AB"
      alias: getBrennerStunden2
      friendly_name: Heures brûleur allure 2
      max_increase_per_hour: 1.05

    - address: "0x088A"
      alias: getBrennerStarts
      friendly_name: Démarrages brûleur
      # Observed cycling is about 31 starts a day. 120 an hour is far beyond
      # anything the appliance can do, and still catches the truncated-counter
      # signature that read 9707 instead of 206315.
      max_increase_per_hour: 120

    # --- Temperatures --------------------------------------------------------
    - address: "0x0800"
      alias: getTempA
      friendly_name: Température extérieure
    - address: "0x0802"
      alias: getTempKist
      friendly_name: Température chaudière
    - address: "0x0804"
      alias: getTempWWist
      friendly_name: Température eau chaude
    - address: "0x6300"
      alias: getTempWWsoll
      friendly_name: Consigne eau chaude
      unit: "°C"
      device_class: temperature
      state_class: measurement

    # --- States --------------------------------------------------------------
    # 0/1 states: as binary sensors Home Assistant shows "Running / Not
    # running" instead of a bare "0", and the history becomes readable at a
    # glance.
    # device_class: running, and definitely NOT heat. The "heat" class reports
    # an overheat condition: Home Assistant renders it "Hot / Normal", which
    # means nothing for a burner. "running" gives "Running / Not running".
    - address: "0x551E"
      alias: getBrennerStatus
      friendly_name: Brûleur
      component: binary_sensor
      device_class: running
      icon: mdi:fire
    # Every heating-circuit entity carries "M2" in its name. The M1 entities
    # published before 2026-10-18 described the idle circuit; giving these new
    # names keeps their statistics from being spliced onto that history.
    - address: "0x3906"
      alias: getPumpeStatusM2
      friendly_name: Circulateur M2
      component: binary_sensor
      device_class: running
    # A text sensor has no memory in Home Assistant beyond purge_keep_days.
    # The mode is the reference every consumption analysis is calibrated
    # against — when the heating season actually started and stopped — so it
    # also has to exist as a number. raw_alias publishes the protocol byte
    # itself, straight from vcontrold.xml, rather than an invented mapping.
    - address: "0x3301"
      alias: getBetriebArtM2
      friendly_name: Mode de fonctionnement M2
      device_class: enum
      options: ["WW", "RED", "NORM", "H+WW", "ABSCHALT"]
      raw_alias: getBetriebArtM2_code
      raw_friendly_name: Mode de fonctionnement M2 (code)

    # --- Additions -----------------------------------------------------------
    # getTempVListM2 in vito.xml: the flow of circuit M2, after the mixer. The
    # alias predates that finding and is kept so the history stays one series.
    - address: "0x080C"
      alias: getTempVList
      friendly_name: Température de départ
    - address: "0x5502"
      alias: getTempKsoll
      friendly_name: Consigne chaudière
    # No return temperature. 0x080A, taken from the 300 profile, answered
    # 20.0 °C and nothing else through six days of burner cycles in October
    # 2026, with the flow swinging between 21 and 53 °C: no probe is behind it.
    # Party-mode setpoint: a manual override here would otherwise be misread as
    # a change in the building's behaviour.
    - address: "0x3308"
      alias: getTempPartyM2
      friendly_name: Consigne réception M2
      unit: "°C"
      device_class: temperature
      state_class: measurement
    - address: "0x3306"
      alias: getTempRaumNorSollM2
      friendly_name: Consigne ambiance normale M2
      unit: "°C"
      device_class: temperature
      state_class: measurement
    - address: "0x3307"
      alias: getTempRaumRedSollM2
      friendly_name: Consigne ambiance réduite M2
      unit: "°C"
      device_class: temperature
      state_class: measurement
    - address: "0x3305"
      alias: getNeigungM2
      friendly_name: Pente de la courbe de chauffe M2
      state_class: measurement
      icon: mdi:chart-line
    - address: "0x3304"
      alias: getNiveauM2
      friendly_name: Niveau de la courbe de chauffe M2
      state_class: measurement
      icon: mdi:arrow-up-down

    # The collective fault: the only alarm the controller exposes.
    - address: "0x7579"
      alias: getStatusStoerung
      friendly_name: Défaut
      component: binary_sensor
      device_class: problem
    - address: "0x0845"
      alias: getPumpeStatusSp
      friendly_name: Pompe de charge ballon
      component: binary_sensor
      device_class: running
    - address: "0x0846"
      alias: getPumpeStatusZirku
      friendly_name: Pompe de bouclage
      component: binary_sensor
      device_class: running
    - address: "0x3302"
      alias: getBetriebSparM2
      friendly_name: Mode économie M2
      component: binary_sensor
      icon: mdi:leaf
    - address: "0x3303"
      alias: getBetriebPartyM2
      friendly_name: Mode réception M2
      component: binary_sensor
      icon: mdi:party-popper

    # --- Recirculation schedule ----------------------------------------------
    # --- Fault history -------------------------------------------------------
    # Ten slots, most recent first. Empty slots report "(empty)" rather than a
    # fault dated year zero. The three that are filled all hold a burner fault
    # from June 2021, well before this installation was taken over.
    #
    - address: "0x7507"
      alias: getError0
      friendly_name: Défaut 1 (le plus récent)
      icon: mdi:alert-circle-outline
    - address: "0x7510"
      alias: getError1
      friendly_name: Défaut 2
      icon: mdi:alert-circle-outline
    - address: "0x7519"
      alias: getError2
      friendly_name: Défaut 3
      icon: mdi:alert-circle-outline
    - address: "0x7522"
      alias: getError3
      friendly_name: Défaut 4
      icon: mdi:alert-circle-outline
    - address: "0x752B"
      alias: getError4
      friendly_name: Défaut 5
      icon: mdi:alert-circle-outline
    - address: "0x7534"
      alias: getError5
      friendly_name: Défaut 6
      icon: mdi:alert-circle-outline
    - address: "0x753D"
      alias: getError6
      friendly_name: Défaut 7
      icon: mdi:alert-circle-outline
    - address: "0x7546"
      alias: getError7
      friendly_name: Défaut 8
      icon: mdi:alert-circle-outline
    - address: "0x754F"
      alias: getError8
      friendly_name: Défaut 9
      icon: mdi:alert-circle-outline
    - address: "0x7558"
      alias: getError9
      friendly_name: Défaut 10
      icon: mdi:alert-circle-outline

# Control from Home Assistant.
#
# No transform: setTempWWsoll is ONE byte, unit ST (<calc get="V" set="V"/>).
# The write length is read from the XML. The previous multiply_10 transform
# wrote 480 for 48 degrees, which does not fit in a byte.
mqtt_hooks:
  - topic: "openv/setTempWWsoll"
    description: "Domestic hot water setpoint (0x6300, 1 byte, unit ST)"
    enabled: true
    action:
      type: "write_address"
      address: "0x6300"
      min_value: 35.0
      max_value: 60.0

  # Normal room setpoint M2 (0x3306, 1 byte, unit ST). This is the setpoint
  # the heating climate entity carries. vito.xml declares no setter for M2;
  # the write length comes from getTempRaumNorSollM2 at the same address.
  #
  # Until 2026-10-18 this hook wrote 0x2306, the idle M1 circuit: the
  # 2026-08-09 change from 22 to 20 °C never reached the heating.
  - topic: "openv/setTempRaumNorSollM2"
    description: "Normal room setpoint M2 (0x3306, 1 byte, unit ST)"
    enabled: true
    action:
      type: "write_address"
      address: "0x3306"
      min_value: 10.0
      max_value: 30.0

  # Reduced room setpoint M2 (0x3307, 1 byte, unit ST). It read 3 °C on
  # 2026-10-18 — the heating off from 22:00 to 06:00. The owner wants the
  # night handled by the radiator valves rather than by the boiler, so it is
  # set equal to the normal setpoint and the M2 schedule no longer cuts.
  - topic: "openv/setTempRaumRedSollM2"
    description: "Reduced room setpoint M2 (0x3307, 1 byte, unit ST)"
    enabled: true
    action:
      type: "write_address"
      address: "0x3307"
      min_value: 3.0
      max_value: 30.0

  # Operating mode M2 (0x3301 per vito.xml, getBetriebArtM2).
  - topic: "openv/setBetriebArtM2"
    description: "Operating mode M2 (0x3301, 1 byte, unit BA)"
    enabled: false        # enable only after a verified round trip
    action:
      type: "write_address"
      address: "0x3301"
      min_value: 0
      max_value: 5


# Climate entities exposed to Home Assistant.
#
# Two of them, because the controller holds two distinct setpoints: domestic
# hot water (0x6300) and the heating circuit's room setpoint (0x3306). Merging
# them into one entity would mean lying about one of the two.
#
# Their mode is read-only. It is not global: each circuit has its own mode
# byte (0x2301 for A1/M1, 0x3301 for M2), and on 2026-10-18 they read WW and
# H+WW at the same moment. Both entities follow M2, the only circuit connected.
mqtt_climates:

  # The cylinder probe gives a genuine measured temperature, so this is a
  # complete thermostat.
  - name: Eau chaude sanitaire
    object_id: vitola_ecs
    icon: mdi:water-thermometer
    target_alias: getTempWWsoll        # -> command on openv/setTempWWsoll
    target_address: "0x6300"
    current_alias: getTempWWist
    action_alias: getBrennerStatus
    min_temp: 10
    max_temp: 60
    temp_step: 1
    # READ-ONLY mode: no mode_address, hence no command topic. The mode is
    # global to the controller (unit BA); setting it from hot water would move
    # the heating too.
    #
    # Hot water is produced in every mode except the full stop.
    modes: ["off", "heat"]
    mode_alias: getBetriebArtM2
    mode_template: "{{ 'off' if value == 'ABSCHALT' else 'heat' }}"

  # No current_alias: the controller exposes NO room sensor. Presenting the
  # flow or boiler temperature as a room temperature would be false — 54 °C
  # shown against a 22 °C setpoint. A setpoint-only entity is plainer, but
  # true.
  - name: Chauffage
    object_id: vitola_chauffage
    icon: mdi:radiator
    target_alias: getTempRaumNorSollM2  # -> command on openv/setTempRaumNorSollM2
    target_address: "0x3306"
    action_alias: getBrennerStatus
    min_temp: 10
    max_temp: 30
    temp_step: 1
    # Heating only runs in the modes that call for it: in WW (hot water only,
    # the summer case) it is stopped, and the entity says so.
    modes: ["off", "heat"]
    mode_alias: getBetriebArtM2
    mode_template: "{{ 'heat' if value in ['RED', 'NORM', 'H+WW'] else 'off' }}"

# Computed values.
#
# The average burner cycle length is THE number the energy case turns on:
# 11,066 h of firing for 206,315 starts gives about 3.2 min per cycle. That is
# the measure of how oversized the current boiler is, and the argument against
# sizing a heat pump from its output.
mqtt_derived:
  - alias: cycleMoyen
    friendly_name: Durée moyenne d'un cycle
    numerator_alias: getBrennerStunden1
    denominator_alias: getBrennerStarts
    factor: 60                 # hours -> minutes
    unit: min
    state_class: measurement
    icon: mdi:timer-sand
    precision: 2

# Cumulative run-time counters.
#
# Home Assistant keeps long-term statistics only for sensors with a
# state_class. The pump states are binary sensors, purged with the states table
# after purge_keep_days, so their run time would never accumulate.
#
# The burner deliberately has no counter here: the appliance already exposes an
# authoritative one at 0x08A7, and a second series for the same physical
# quantity would diverge from it.
#
# These names are final. Renaming an entity orphans its statistics and starts a
# new empty series, so the naming has to be settled before history accumulates.
# --- Weekly schedules --------------------------------------------------------
#
# A circuit's programme is seven addresses, one per weekday, and on this
# installation all seven carry the same period. Publishing them separately puts
# seven identical values in front of someone who wants to know one thing: when
# the circuit is allowed to run. Each entity below collapses its week, so a
# uniform programme reads as "05:30-22:00" and a week where the weekend differs
# still says so.
#
# Text, so no state_class. The historisable numbers are the measured run times
# published under mqtt_runtime, which are worth more than the programmed hours.
mqtt_schedules:
  # The loop is programmed 05:30-22:00 daily: 16.5 h a day, not the 24 h that
  # was assumed. This schedule is what would be narrowed to cut the standing
  # loss, so it is worth watching for changes.
  - alias: scheduleZirku
    friendly_name: Programme bouclage
    icon: mdi:calendar-clock
    addresses: ["0x2200", "0x2208", "0x2210", "0x2218", "0x2220", "0x2228", "0x2230"]

  - alias: scheduleWW
    friendly_name: Programme eau chaude
    icon: mdi:calendar-clock
    addresses: ["0x2100", "0x2108", "0x2110", "0x2118", "0x2120", "0x2128", "0x2130"]

  - alias: scheduleM2
    friendly_name: Programme chauffage M2
    icon: mdi:calendar-clock
    addresses: ["0x3000", "0x3008", "0x3010", "0x3018", "0x3020", "0x3028", "0x3030"]

mqtt_runtime:
  # The highest-value measurement in this configuration. The recirculation pump
  # reads 1 in August with no space heating; a loop running around the clock
  # costs 1300-2600 kWh a year if poorly insulated, against 3250 kWh a year of
  # otherwise unexplained hot-water loss measured at the gas meter. Proving or
  # killing that needs run-time history, and the remedy is a time program
  # rather than any hardware work.
  - source_alias: getPumpeStatusZirku
    alias: pumpZirkuHours
    friendly_name: Heures pompe de bouclage
    icon: mdi:pump

  - source_alias: getPumpeStatusM2
    alias: pumpM2Hours
    friendly_name: Heures circulateur M2
    icon: mdi:pump

  - source_alias: getPumpeStatusSp
    alias: pumpSpHours
    friendly_name: Heures pompe de charge ballon
    icon: mdi:pump
