# Copier en config-openv.yaml et adapter. Le fichier reel est gitignore.
# Les chemins third_party/ sont crees par : make deps

device: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_XXXX-if00-port0
vcontrol_xml: third_party/vcontrold/xml/kw/vcontrold.xml
vito_xml:     third_party/vcontrold/xml/kw/vito.xml

web: true
web_port: "8080"
verbose: false

refresh_groups:
  - name: Chaudiere
    interval: 60s
    enabled: true
    addresses: ["0x0800", "0x0802", "0x0810", "0x0811", "0x551E", "0x2906"]

mqtt:
  enabled: true
  host: broker.local:1883
  username: vcontrold
  password: changeme          # ne pas versionner ce fichier
  topic_root: openv
  refresh_threshold: 1h
  addresses:
    - {address: "0x08A7", alias: getBrennerStunden1}   # heures brûleur, unite CS
    - {address: "0x088A", alias: getBrennerStarts}     # demarrages, unite CO
    - {address: "0x551E", alias: getBrennerStatus}     # brûleur 0/1
    - {address: "0x2906", alias: getPumpeStatusM1}     # circulateur 0/1
    - {address: "0x0800", alias: getTempAussen}
    - {address: "0x0802", alias: getTempKist}
    - {address: "0x0810", alias: getTempWWist}
    - {address: "0x0811", alias: getTempVLsoll}
    - {address: "0x2301", alias: getBetriebArtM1}      # mode, unite BA
