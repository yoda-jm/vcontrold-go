# Copy to config-openv.yaml and adapt. The real file is gitignored.
# The third_party/ paths are created by: make deps
#
# All addresses and lengths come from vito.xml; only 0x088A is corrected, via
# overrides/vitola200-kw2.xml. Nothing is hard-coded here.
#
# On naming: the get*/set* identifiers and the German terms in them (soll =
# setpoint, ist = actual, WW = Warmwasser/hot water, Betriebsart = operating
# mode) are NOT ours to rename. They are the command names of the community
# vito.xml, and keeping them is what lets any address here be traced back to
# the upstream XML and to the openv documentation. Only the friendly_name
# fields are translated, because those are what Home Assistant displays.

device: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_XXXX-if00-port0

vcontrol_xml:       third_party/vcontrold/xml/kw/vcontrold.xml
vito_xml:           third_party/vcontrold/xml/kw/vito.xml
vito_overrides_xml: overrides/vitola200-kw2.xml

# web: true is MANDATORY. MQTT publishing is carried by the web server; in CLI
# mode the daemon reads once and exits without ever publishing.
web: true
web_port: "8080"
verbose: false

refresh_groups:
  # What moves: states and temperatures.
  - name: Temperatures and states
    interval: 60s
    enabled: true
    addresses:
      - "0x0800"   # outside temperature
      - "0x0802"   # boiler temperature
      - "0x0804"   # hot water temperature
      - "0x080C"   # flow temperature (the only flow probe present)
      - "0x5502"   # boiler setpoint
      - "0x080A"   # return temperature
      - "0x551E"   # burner state
      - "0x2906"   # circulator M1 state
      - "0x0845"   # cylinder charge pump
      - "0x0846"   # circulation pump
      - "0x2301"   # operating mode
      - "0x7579"   # collective fault

  # What barely moves: counters and setpoints. Polling them often gains
  # nothing and ties up the optical link.
  - name: Counters and setpoints
    interval: 5m
    enabled: true
    addresses:
      - "0x08A7"   # burner hours
      - "0x088A"   # burner starts
      - "0x08AB"   # burner hours, stage 2
      - "0x6300"   # hot water setpoint
      - "0x2306"   # normal room setpoint M1
      - "0x2307"   # reduced room setpoint M1
      - "0x2304"   # heating curve level
      - "0x2305"   # heating curve slope
      - "0x2302"   # eco mode
      - "0x2303"   # party mode
      - "0x2308"   # party setpoint

mqtt:
  enabled: true
  host: broker.local:1883
  username: vcontrold
  password: changeme          # ne pas versionner ce fichier
  topic_root: openv
  refresh_threshold: 1h

  # The alias gives the topic name: openv/<alias>.
  # device_class / state_class are derived from the vito.xml unit; they appear
  # here only where the XML is not enough.
  addresses:
    # --- The two counters the energy case rests on --------------------------
    - address: "0x08A7"
      alias: getBrennerStunden1
      friendly_name: Heures brûleur
      # Burner hours cannot rise faster than one hour per hour of wall time.
      # A corrupt frame that passes this bound is indistinguishable from truth;
      # one that does not is refused before it can become permanent history.
      max_increase_per_hour: 1.05
    # Stage 2 of the burner. The appliance is sold as 22/24 kW, which suggests
    # two firing rates, and hours spent on stage 2 are not counted by stage 1.
    # Any efficiency figure has to be computed on the sum of both.
    - address: "0x08AB"
      alias: getBrennerStunden2
      friendly_name: Heures brûleur allure 2
      max_increase_per_hour: 1.05

    - address: "0x088A"
      alias: getBrennerStarts
      friendly_name: Démarrages brûleur
      # Observed cycling is about 31 starts a day. 120 an hour is far beyond
      # anything the appliance can do, and still catches the truncated-counter
      # signature that read 9707 instead of 206315.
      max_increase_per_hour: 120

    # --- Temperatures --------------------------------------------------------
    - address: "0x0800"
      alias: getTempA
      friendly_name: Température extérieure
    - address: "0x0802"
      alias: getTempKist
      friendly_name: Température chaudière
    - address: "0x0804"
      alias: getTempWWist
      friendly_name: Température eau chaude
    - address: "0x6300"
      alias: getTempWWsoll
      friendly_name: Consigne eau chaude
      unit: "°C"
      device_class: temperature
      state_class: measurement

    # --- States --------------------------------------------------------------
    # 0/1 states: as binary sensors Home Assistant shows "Running / Not
    # running" instead of a bare "0", and the history becomes readable at a
    # glance.
    # device_class: running, and definitely NOT heat. The "heat" class reports
    # an overheat condition: Home Assistant renders it "Hot / Normal", which
    # means nothing for a burner. "running" gives "Running / Not running".
    - address: "0x551E"
      alias: getBrennerStatus
      friendly_name: Brûleur
      component: binary_sensor
      device_class: running
      icon: mdi:fire
    - address: "0x2906"
      alias: getPumpeStatusM1
      friendly_name: Circulateur M1
      component: binary_sensor
      device_class: running
    # A text sensor has no memory in Home Assistant beyond purge_keep_days.
    # The mode is the reference every consumption analysis is calibrated
    # against — when the heating season actually started and stopped — so it
    # also has to exist as a number. raw_alias publishes the protocol byte
    # itself, straight from vcontrold.xml, rather than an invented mapping.
    - address: "0x2301"
      alias: getBetriebArtM1
      friendly_name: Mode de fonctionnement
      device_class: enum
      options: ["WW", "RED", "NORM", "H+WW", "ABSCHALT"]
      raw_alias: getBetriebArtM1_code
      raw_friendly_name: Mode de fonctionnement (code)

    # --- Additions -----------------------------------------------------------
    - address: "0x080C"
      alias: getTempVList
      friendly_name: Température de départ
    - address: "0x5502"
      alias: getTempKsoll
      friendly_name: Consigne chaudière
    # Return temperature. The sensor is present on this installation: 0x080A
    # reads a plausible value rather than a reserved one. Its address comes
    # from the 300 profile, so it is declared in overrides/ rather than
    # hardcoded. Needed for the delta-T across the circuit and to watch the
    # condensation risk on a non-condensing cast-iron boiler.
    - address: "0x080A"
      alias: getTempRL
      friendly_name: Température de retour
    # Party-mode setpoint: a manual override here would otherwise be misread as
    # a change in the building's behaviour.
    - address: "0x2308"
      alias: getTempPartyM1
      friendly_name: Consigne réception
      unit: "°C"
      device_class: temperature
      state_class: measurement
    - address: "0x2306"
      alias: getTempRaumNorSollM1
      friendly_name: Consigne ambiance normale
      unit: "°C"
      device_class: temperature
      state_class: measurement
    - address: "0x2307"
      alias: getTempRaumRedSollM1
      friendly_name: Consigne ambiance réduite
      unit: "°C"
      device_class: temperature
      state_class: measurement
    - address: "0x2305"
      alias: getNeigungM1
      friendly_name: Pente de la courbe de chauffe
      state_class: measurement
      icon: mdi:chart-line
    - address: "0x2304"
      alias: getNiveauM1
      friendly_name: Niveau de la courbe de chauffe
      state_class: measurement
      icon: mdi:arrow-up-down

    # The collective fault: the only alarm the controller exposes.
    - address: "0x7579"
      alias: getStatusStoerung
      friendly_name: Défaut
      component: binary_sensor
      device_class: problem
    - address: "0x0845"
      alias: getPumpeStatusSp
      friendly_name: Pompe de charge ballon
      component: binary_sensor
      device_class: running
    - address: "0x0846"
      alias: getPumpeStatusZirku
      friendly_name: Pompe de bouclage
      component: binary_sensor
      device_class: running
    - address: "0x2302"
      alias: getBetriebSparM1
      friendly_name: Mode économie
      component: binary_sensor
      icon: mdi:leaf
    - address: "0x2303"
      alias: getBetriebPartyM1
      friendly_name: Mode réception
      component: binary_sensor
      icon: mdi:party-popper

# Control from Home Assistant.
#
# No transform: setTempWWsoll is ONE byte, unit ST (<calc get="V" set="V"/>).
# The write length is read from the XML. The previous multiply_10 transform
# wrote 480 for 48 degrees, which does not fit in a byte.
mqtt_hooks:
  - topic: "openv/setTempWWsoll"
    description: "Domestic hot water setpoint (0x6300, 1 byte, unit ST)"
    enabled: true
    action:
      type: "write_address"
      address: "0x6300"
      min_value: 35.0
      max_value: 60.0

  # Normal room setpoint M1 (0x2306, 1 byte, unit ST). This is the setpoint
  # the heating climate entity carries.
  - topic: "openv/setTempRaumNorSollM1"
    description: "Normal room setpoint M1 (0x2306, 1 byte, unit ST)"
    enabled: true
    action:
      type: "write_address"
      address: "0x2306"
      min_value: 10.0
      max_value: 30.0

  # setBetriebArtM1 is at 0x2301 per vito.xml — not 0x2323, which was
  # configured until now and therefore never controlled anything.
  - topic: "openv/setBetriebArtM1"
    description: "Operating mode M1 (0x2301, 1 byte, unit BA)"
    enabled: false        # enable only after a verified round trip
    action:
      type: "write_address"
      address: "0x2301"
      min_value: 0
      max_value: 5


# Climate entities exposed to Home Assistant.
#
# Two of them, because the controller holds two distinct setpoints: domestic
# hot water (0x6300) and the heating circuit's room setpoint (0x2306). Merging
# them into one entity would mean lying about one of the two.
#
# Their mode is read-only: the Vitotronic 200 KW2 has a single GLOBAL mode
# (unit BA, address 0x2301) shared by both uses. Exposing it as a per-zone mode
# would suggest separate control the appliance cannot deliver.
mqtt_climates:

  # The cylinder probe gives a genuine measured temperature, so this is a
  # complete thermostat.
  - name: Eau chaude sanitaire
    object_id: vitola_ecs
    icon: mdi:water-thermometer
    target_alias: getTempWWsoll        # -> command on openv/setTempWWsoll
    target_address: "0x6300"
    current_alias: getTempWWist
    action_alias: getBrennerStatus
    min_temp: 10
    max_temp: 60
    temp_step: 1
    # READ-ONLY mode: no mode_address, hence no command topic. The mode is
    # global to the controller (unit BA); setting it from hot water would move
    # the heating too.
    #
    # Hot water is produced in every mode except the full stop.
    modes: ["off", "heat"]
    mode_alias: getBetriebArtM1
    mode_template: "{{ 'off' if value == 'ABSCHALT' else 'heat' }}"

  # No current_alias: the controller exposes NO room sensor. Presenting the
  # flow or boiler temperature as a room temperature would be false — 54 °C
  # shown against a 22 °C setpoint. A setpoint-only entity is plainer, but
  # true.
  - name: Chauffage
    object_id: vitola_chauffage
    icon: mdi:radiator
    target_alias: getTempRaumNorSollM1  # -> command on openv/setTempRaumNorSollM1
    target_address: "0x2306"
    action_alias: getBrennerStatus
    min_temp: 10
    max_temp: 30
    temp_step: 1
    # Heating only runs in the modes that call for it: in WW (hot water only,
    # the summer case) it is stopped, and the entity says so.
    modes: ["off", "heat"]
    mode_alias: getBetriebArtM1
    mode_template: "{{ 'heat' if value in ['RED', 'NORM', 'H+WW'] else 'off' }}"

# Computed values.
#
# The average burner cycle length is THE number the energy case turns on:
# 11,066 h of firing for 206,315 starts gives about 3.2 min per cycle. That is
# the measure of how oversized the current boiler is, and the argument against
# sizing a heat pump from its output.
mqtt_derived:
  - alias: cycleMoyen
    friendly_name: Durée moyenne d'un cycle
    numerator_alias: getBrennerStunden1
    denominator_alias: getBrennerStarts
    factor: 60                 # hours -> minutes
    unit: min
    state_class: measurement
    icon: mdi:timer-sand
    precision: 2

# Cumulative run-time counters.
#
# Home Assistant keeps long-term statistics only for sensors with a
# state_class. The pump states are binary sensors, purged with the states table
# after purge_keep_days, so their run time would never accumulate.
#
# The burner deliberately has no counter here: the appliance already exposes an
# authoritative one at 0x08A7, and a second series for the same physical
# quantity would diverge from it.
#
# These names are final. Renaming an entity orphans its statistics and starts a
# new empty series, so the naming has to be settled before history accumulates.
mqtt_runtime:
  # The highest-value measurement in this configuration. The recirculation pump
  # reads 1 in August with no space heating; a loop running around the clock
  # costs 1300-2600 kWh a year if poorly insulated, against 3250 kWh a year of
  # otherwise unexplained hot-water loss measured at the gas meter. Proving or
  # killing that needs run-time history, and the remedy is a time program
  # rather than any hardware work.
  - source_alias: getPumpeStatusZirku
    alias: pumpZirkuHours
    friendly_name: Heures pompe de bouclage
    icon: mdi:pump

  - source_alias: getPumpeStatusM1
    alias: pumpM1Hours
    friendly_name: Heures circulateur M1
    icon: mdi:pump

  - source_alias: getPumpeStatusSp
    alias: pumpSpHours
    friendly_name: Heures pompe de charge ballon
    icon: mdi:pump
